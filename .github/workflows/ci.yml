name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Scan tracked files for common secret formats
        run: uv run python scripts/check_tracked_secrets.py

      - name: Verify production container builds
        run: docker build --tag ssp-licensing-agent:${{ github.sha }} .
