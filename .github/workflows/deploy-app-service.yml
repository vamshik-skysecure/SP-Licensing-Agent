name: Deploy App Service

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build minimal deployment package
        shell: bash
        run: |
          mkdir release
          cp -R app config main.py requirements.txt release/
          cd release
          zip -r ../release.zip .

      - name: Deploy application package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release.zip

      - name: Apply five-minute inactive-session expiry
        shell: bash
        run: |
          az webapp config appsettings set \
            --resource-group rg-skysecure-microsoft-pricing-agent-dev \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --settings SESSION_TTL_MINUTES=5 \
            --output none
          az webapp config appsettings delete \
            --resource-group rg-skysecure-microsoft-pricing-agent-dev \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --setting-names SESSION_TTL_HOURS \
            --output none

      - name: Restart and verify application health
        shell: bash
        run: |
          az webapp restart \
            --resource-group rg-skysecure-microsoft-pricing-agent-dev \
            --name "${{ vars.AZURE_WEBAPP_NAME }}"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health/ready"; then
              exit 0
            fi
            sleep 10
          done
          echo "Application readiness did not succeed within five minutes." >&2
          exit 1
