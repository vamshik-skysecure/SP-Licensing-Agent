[project]
name = "skysecure-ssp-licensing-agent"
version = "1.0.0"
description = "Auditable WhatsApp advisor for Microsoft licensing requirement capture and pricing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11.0",
    "azure-identity>=1.24.0",
    "azure-storage-blob>=12.26.0",
    "av>=14.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=2.21.0",
    "openpyxl>=3.1.5",
    "pillow>=12.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rapidfuzz>=3.14.0",
    "reportlab>=4.4.0",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "pypdf>=6.0.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "config*", "docs*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
